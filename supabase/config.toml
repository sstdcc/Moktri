# send-fcm is invoked by the trg_fcm_delivery database trigger via pg_net,
# which does not send a Supabase user JWT in the Authorization header.
# Auth is handled inside the function via the X-FCM-Secret header.
# Without this, redeploying without --no-verify-jwt would flip the platform
# check back to true and break the pg_net -> send-fcm delivery path.
[functions.send-fcm]
verify_jwt = false

# verify-otp is a PRE-AUTHENTICATION endpoint: the client calls it (with only
# the anon/publishable key, no user JWT) to verify an OTP and receive a fresh
# session. Requiring a user JWT would break the legitimate OTP login flow.
# Aligned with send-otp (P7-FIND-01 remediation).
[functions.verify-otp]
verify_jwt = false